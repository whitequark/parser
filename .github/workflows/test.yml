name: Tests

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  test:
    # ruby/setup-ruby provides only the latest patch of each series for ubuntu-26.04 and later,
    # so Ruby 3.4.1 is available only on ubuntu-24.04.
    runs-on: ${{ matrix.ruby == '3.4.1' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      CI: true
      TRUFFLERUBYOPT: "--engine.Mode=latency"
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1.7", "3.2.11", "3.3.13", "3.4.1", "jruby-9.4"]
        test_command: ["bundle exec rake test"]
        include:
          - ruby: "head"
            test_command: "bundle exec rake test || true"
          - ruby: "truffleruby"
            test_command: "bundle exec rake test || true"
          - ruby: "3.2.11"
            test_command: "./ci/run_rubocop_specs || true"
          - ruby: "3.3.13"
            test_command: "./ci/run_rubocop_specs || true"
          - ruby: "3.4.1"
            test_command: "./ci/run_rubocop_specs || true"
    steps:
    - uses: actions/checkout@v4
    - name: Install Ragel
      run: |
        sudo apt-get update
        sudo apt-get install ragel
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run tests
      run: |
        ${{ matrix.test_command }}
